[package]
name = "yamlfication"
description = "Umbrella crate for the Yamlfication compiler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[workspace]
members = ["crates/yamlfy-syntax", "crates/yamlfy-config", "crates/yamlfy-core", "crates/yamlfy-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Richard Christopher"]
repository = "https://github.com/NeoTecDigital/yamlfy"
homepage = "https://github.com/NeoTecDigital/yamlfy"
keywords = ["yaml", "graph", "database", "parser", "compiler"]
categories = ["parser-implementations", "database-implementations"]

[workspace.dependencies]
yamlfy-syntax = { path = "crates/yamlfy-syntax", version = "0.1.0" }
yamlfy-config = { path = "crates/yamlfy-config", version = "0.1.0" }
yamlfy-core = { path = "crates/yamlfy-core", version = "0.1.0" }
saphyr-parser = "0.0.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.5"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"

[dependencies]
yamlfy-syntax.workspace = true
yamlfy-config.workspace = true
yamlfy-core.workspace = true

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
