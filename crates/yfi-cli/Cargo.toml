[package]
name = "yfi-cli"
description = "The yamlfy command-line interface."
version.workspace = true
edition.workspace = true
# tracing-appender pulls in `time`, which requires 1.88; the library
# crates still build on the workspace MSRV of 1.85.
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["tests"]

[[bin]]
name = "yamlfy"
path = "src/main.rs"

[dependencies]
yfi-syntax.workspace = true
yfi-config.workspace = true
yfi-core.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[lints]
workspace = true
