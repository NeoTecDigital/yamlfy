# Base YAML. `extends` is an ordinary field and `<<` is plain YAML merge.
defaults: &defaults
  region: east
  retries: 2
web:
  <<: *defaults
  extends: not-inheritance
  port: 80
  # A plain sequence of bare names. In a `.yfy` every one of these is a member
  # of the sequence; here they are data, and the file class is the whole of the
  # difference (D6.6).
  tags: [alpha, beta]
